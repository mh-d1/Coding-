<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CodeForge Pro</title>

    <!-- CodeMirror -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/dracula.min.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js">
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/xml/xml.min.js">
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/css/css.min.js">
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/javascript/javascript.min.js">
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/closetag.min.js">
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/closebrackets.min.js">
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/fold/foldcode.min.js">
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/fold/foldgutter.min.js">
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/fold/brace-fold.min.js">
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/fold/foldgutter.min.css" />

    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/pro.css" />
    <link rel="stylesheet" href="css/responsive.css" />
</head>
<body>

    <div id="app" data-theme="green">

        <!-- HEADER -->
        <header class="app-header">
            <div class="logo">
                <svg viewBox="0 0 24 24" width="24" height="24">
                    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z" />
                </svg>
                Code<span>Forge</span>
                <span class="badge-pro">Pro</span>
            </div>

            <div class="header-center">
                <div class="project-picker">
                    <select id="projectSelector">
                        <option value="starter">Starter</option>
                        <option value="portfolio">Portfolio</option>
                        <option value="landing">Landing</option>
                    </select>
                </div>
            </div>

            <div class="header-right">
                <div class="theme-selector" id="themeSelector">
                    <span class="theme-dot green active" data-theme="green" title="Green"></span>
                    <span class="theme-dot pink" data-theme="pink" title="Pink"></span>
                    <span class="theme-dot blue" data-theme="blue" title="Blue"></span>
                    <span class="theme-dot red" data-theme="red" title="Red"></span>
                    <span class="theme-dot purple" data-theme="purple" title="Purple"></span>
                    <span class="theme-dot orange" data-theme="orange" title="Orange"></span>
                </div>
                <button class="icon-btn" id="resetProjectBtn" title="Reset Project">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M1 4v6h6" />
                        <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10" />
                    </svg>
                </button>
                <button class="icon-btn run-btn" id="runBtn" title="Run (Ctrl+Enter)">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                        <polygon points="5 3 19 12 5 21 5 3" />
                    </svg>
                </button>
            </div>
        </header>

        <!-- MAIN -->
        <div class="app-main">

            <!-- Editor -->
            <div class="pro-editor-area" id="proEditorArea">
                <div class="editor-tabs" id="editorTabs">
                    <span class="tab active" data-file="index.html">index.html</span>
                    <span class="tab" data-file="style.css">style.css</span>
                    <span class="tab" data-file="script.js">script.js</span>
                </div>
                <div class="editor-wrap">
                    <textarea id="codeEditor"></textarea>
                </div>
            </div>

            <!-- Divider -->
            <div class="resize-handle" id="resizeHandle"></div>

            <!-- Preview + Console -->
            <div class="pro-preview-area">
                <div class="preview-toolbar">
                    <button class="device-btn active" data-device="desktop">Desktop</button>
                    <button class="device-btn" data-device="tablet">Tablet</button>
                    <button class="device-btn" data-device="mobile">Mobile</button>
                    <span class="spacer"></span>
                    <button class="icon-btn" id="refreshPreviewBtn" title="Refresh">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M23 4v6h-6" />
                            <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10" />
                        </svg>
                    </button>
                    <button class="icon-btn" id="fullscreenPreviewBtn" title="Fullscreen">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M8 3H5a2 2 0 0 0-2 2v3" />
                            <path d="M21 8V5a2 2 0 0 0-2-2h-3" />
                            <path d="M16 21h3a2 2 0 0 0 2-2v-3" />
                            <path d="M3 16v3a2 2 0 0 0 2 2h3" />
                        </svg>
                    </button>
                </div>
                <div class="preview-frame-wrap" id="previewWrap">
                    <iframe id="previewFrame" sandbox="allow-scripts allow-modals"></iframe>
                </div>
                <div class="console-panel">
                    <div class="console-header">
                        <span>Console</span>
                        <button id="consoleClear">Clear</button>
                    </div>
                    <div class="console-body" id="consoleBody">
                        <div class="log-entry info">
                            <span class="log-time">●</span> Ready. Run your code or press Ctrl+Enter.
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Mobile Nav -->
        <div class="mobile-nav" id="mobileNav">
            <div class="mobile-tabs" id="mobileTabs">
                <button class="active" data-view="code">⌨️ Code</button>
                <button data-view="preview">👁 Preview</button>
            </div>
        </div>
    </div>

    <script type="module" src="js/main.js"></script>
</body>
</html>
